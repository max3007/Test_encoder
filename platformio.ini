; Lo sketch resta in TesterEncoder/ (apribile anche con Arduino IDE);
; pio/main.cpp lo include, perche' il convertitore .ino di PlatformIO si confonde con la pagina HTML.
[platformio]
src_dir = pio
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = default, time
build_flags = -Wall
lib_deps =
    WiFi
    WebServer
